<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archive · People and Mathematics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600&family=Vazirmatn:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF7EF;color:#1C1814;font-family:"Newsreader",serif}
a{color:#1C1814;text-decoration:none}
a:hover{color:#C8633E}
.wrap{max-width:1120px;margin:0 auto;padding:48px 48px 72px;display:flex;flex-direction:column;gap:36px;box-sizing:border-box}
.sans{font-family:"Hanken Grotesk",sans-serif}
[dir=rtl] body,[dir=rtl] .serif{font-family:"B Nazanin","Vazirmatn","Noto Naskh Arabic",serif}
[dir=rtl] .sans{font-family:"Vazirmatn",sans-serif;letter-spacing:0!important;text-transform:none!important}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:20px;flex-wrap:wrap;border-bottom:1px solid #1C1814;padding-bottom:16px;font-size:14px}
.body{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:44px;align-items:start}
figure{margin:0;display:flex;flex-direction:column;gap:8px}
figure img{width:100%;height:auto;display:block;background:#EFE8DA;cursor:zoom-in}
.hint{font-size:13px;color:#6B6259}
.kind{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#C8633E}
h1{margin:0;font-size:32px;font-weight:500;line-height:1.25;text-wrap:pretty}
[dir=rtl] h1{font-size:32px;line-height:1.6}
.cap{margin:0;font-size:18px;line-height:1.6;color:#3A332C;text-wrap:pretty}
[dir=rtl] .cap{font-size:19px;line-height:1.95}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 18px;border-top:1px solid #E2D8C6;padding-top:18px}
dt{font-size:13px;color:#6B6259;padding-top:3px}
dd{margin:0;font-size:17px;line-height:1.5}
[dir=rtl] dd{line-height:1.8}
dd a{color:#C8633E}
.note{font-size:16px;line-height:1.6;color:#3A332C;border-top:1px solid #E2D8C6;padding-top:18px;margin:0}
.note a{color:#C8633E}
.side{display:flex;flex-direction:column;gap:18px}
#zoom{position:fixed;inset:0;background:rgba(13,12,11,.92);display:none;overflow:auto;z-index:10;cursor:zoom-out}
#zoom img{display:block;max-width:none;width:200%;margin:0 auto}
@media (max-width:820px){.body{grid-template-columns:minmax(0,1fr)}.wrap{padding:28px 20px 56px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top sans"><a href="index.html" id="back"></a><a href="#" id="lang" style="font-weight:500"></a></div>
  <div class="body" id="body"></div>
</div>
<div id="zoom"><img alt=""></div>
<script src="../data/archive.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search), L=q.get('lang')==='fa'?'fa':'en', id=q.get('id');
  var fd=function(s){return L==='fa'?String(s).replace(/\d/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'[d];}):String(s);};
  var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var T={
    en:{back:"← Archive",lang:"فارسی",date:"Date",source:"Source",prov:"Provenance",people:"People",appears:"Appears in",notyet:"Not yet part of a story.",zoom:"Click the image to enlarge.",missing:"This item could not be found.",note:function(t){return 'Do you know more about this '+t+'? <a href="mailto:'+PM_ARCHIVE_CONTACT+'?subject='+encodeURIComponent('Archive: '+id)+'">Write to us</a>.';}},
    fa:{back:"اسناد و تصاویر →",lang:"English",date:"تاریخ",source:"منبع",prov:"خاستگاه",people:"آدم‌ها",appears:"در داستان‌ها",notyet:"هنوز بخشی از داستانی نیست.",zoom:"برای بزرگ‌نمایی روی تصویر کلیک کنید.",missing:"این مورد پیدا نشد.",note:function(){return 'چیزی بیشتر دربارهٔ این مورد می‌دانید؟ <a href="mailto:'+PM_ARCHIVE_CONTACT+'?subject='+encodeURIComponent('Archive: '+id)+'">برای ما بنویسید</a>.';}}
  }[L];
  if(L==='fa'){document.documentElement.dir='rtl';document.documentElement.lang='fa';}
  var $=function(x){return document.getElementById(x);};
  $('back').textContent=T.back; $('back').href='index.html'+(L==='fa'?'?lang=fa':'');
  $('lang').textContent=T.lang; $('lang').href='?id='+encodeURIComponent(id||'')+(L==='fa'?'':'&lang=fa');
  $('lang').style.fontFamily = L==='fa' ? "'Hanken Grotesk',sans-serif" : "'Vazirmatn',sans-serif";
  var it=(window.PM_ARCHIVE||[]).filter(function(i){return i.id===id;})[0];
  if(!it){ $('body').innerHTML='<p class="cap serif">'+T.missing+'</p>'; return; }
  var d=it[L], typ=PM_ARCHIVE_TYPES[it.type][L];
  document.title=d.title+(L==='fa'?' · اسناد و تصاویر':' · Archive · People and Mathematics');
  var rows='';
  var row=function(k,v){ if(v) rows+='<dt class="sans">'+k+'</dt><dd class="serif">'+v+'</dd>'; };
  row(T.date, esc(fd(d.date)));
  row(T.source, d.sourceHref ? '<a href="'+d.sourceHref+'" target="_blank" rel="noopener">'+esc(d.source)+'</a>' : esc(d.source||''));
  row(T.prov, esc(d.provenance||''));
  row(T.people, esc(d.people||''));
  var ap=(it.appearsIn||[]).map(function(a){var h=a.href; if(L==='fa'&&h==='index.html')h='fa.html'; return '<a href="../'+h+'">'+esc(a[L])+'</a>';}).join('<br>');
  row(T.appears, ap || '<span style="color:#6B6259">'+T.notyet+'</span>');
  $('body').innerHTML=
    '<figure><img src="../'+it.img+'" alt="'+esc(d.title)+'"><figcaption class="hint sans">'+T.zoom+'</figcaption></figure>'+
    '<div class="side"><div class="kind sans">'+typ+'</div><h1 class="serif">'+esc(d.title)+'</h1>'+
    '<p class="cap serif">'+esc(d.caption)+'</p><dl>'+rows+'</dl><p class="note serif">'+T.note(typ.toLowerCase())+'</p></div>';
  var z=$('zoom'), zi=z.querySelector('img');
  document.querySelector('figure img').onclick=function(){ zi.src='../'+it.img; z.style.display='block'; };
  z.onclick=function(){ z.style.display='none'; };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') z.style.display='none'; });
})();
</script>
<script src="../counter.js"></script>
</body>
</html>
